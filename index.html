<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2f86d8" />
    <meta name="description" content="CapyDindon — aide un jeune capybara à devenir une légende." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CapyDindon" />
    <title>CapyDindon</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #2f86d8; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="vignette" aria-hidden="true"></div>
      <div id="ui">
        <div id="hud"></div>
        <div id="modal"></div>
        <div id="toasts"></div>
      </div>
      <div id="touch" data-testid="touch-controls">
        <div class="pad left">
          <button type="button" data-hold="left" aria-label="Gauche"><span>◀</span></button>
          <button type="button" data-hold="right" aria-label="Droite"><span>▶</span></button>
        </div>
        <div class="pad right">
          <button type="button" class="action" data-hold="action" aria-label="Action"><span>★<small>agir</small></span></button>
          <button type="button" class="jump" data-hold="jump" aria-label="Sauter"><span>▲<small>saut</small></span></button>
        </div>
      </div>
      <div id="fade"></div>
      <div id="portrait" data-testid="portrait" role="alert">
        <div class="portrait-card">
          <svg viewBox="0 0 140 96" aria-hidden="true">
            <path d="M18 40c10-22 20-16 14 8" fill="#f6c453" />
            <ellipse cx="62" cy="62" rx="36" ry="20" fill="#c47c3c" />
            <ellipse cx="66" cy="68" rx="20" ry="10" fill="#f3d7b4" />
            <rect x="84" y="40" width="22" height="22" rx="7" fill="#d7a36a" />
            <rect x="100" y="48" width="26" height="16" rx="4" fill="#f0d0ae" />
            <ellipse cx="122" cy="55" rx="3" ry="2.2" fill="#3a2418" />
            <ellipse cx="90" cy="34" rx="6" ry="8" fill="#c47c3c" />
            <circle cx="96" cy="46" r="6" fill="#fffaf6" />
            <circle cx="98" cy="47" r="2.8" fill="#1a120e" />
            <circle cx="95" cy="45" r="1.3" fill="#fff" />
          </svg>
          <h1>Tourne ton appareil</h1>
          <p>Capy a le vertige en portrait. Joue en paysage.</p>
        </div>
      </div>
      <div id="live" class="sr-only" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
