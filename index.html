<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd4ff" />
    <meta name="description" content="CapyDindon — aide un jeune capybara à devenir une légende." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CapyDindon" />
    <title>CapyDindon</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #8fd4ff; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="vignette" aria-hidden="true"></div>
      <div id="ui">
        <div id="hud"></div>
        <div id="modal"></div>
        <div id="toasts"></div>
      </div>
      <div id="touch" data-testid="touch-controls">
        <div class="pad left">
          <button type="button" data-hold="left" aria-label="Gauche"><span>◀</span></button>
          <button type="button" data-hold="right" aria-label="Droite"><span>▶</span></button>
        </div>
        <div class="pad right">
          <button type="button" class="action" data-hold="action" aria-label="Action"><span>★</span></button>
          <button type="button" class="jump" data-hold="jump" aria-label="Sauter"><span>▲</span></button>
        </div>
      </div>
      <div id="fade"></div>
      <div id="portrait" data-testid="portrait" role="alert">
        <div class="portrait-card">
          <svg viewBox="0 0 120 90" aria-hidden="true">
            <ellipse cx="60" cy="58" rx="36" ry="22" fill="#c6864a" />
            <ellipse cx="86" cy="48" rx="18" ry="16" fill="#d39a62" />
            <ellipse cx="78" cy="40" rx="8" ry="6" fill="#e7b07a" />
            <circle cx="96" cy="46" r="5" fill="#5c3d32" />
            <circle cx="80" cy="42" r="3.2" fill="#fffaf4" />
            <circle cx="81.2" cy="42.4" r="1.5" fill="#2b211c" />
            <ellipse cx="74" cy="50" rx="4" ry="2.2" fill="#f2a3a3" opacity="0.8" />
            <path d="M18 34c8-16 20-10 16 2" fill="#f2c14e" />
          </svg>
          <h1>Tourne ton appareil</h1>
          <p>Capy a le vertige en portrait. Joue en paysage.</p>
        </div>
      </div>
      <div id="live" class="sr-only" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
